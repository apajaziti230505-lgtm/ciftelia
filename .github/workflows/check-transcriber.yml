name: Kontrollo Çiftelia Studio
on:
  push:
    branches: [main]
    paths:
      - 'js/audio-transcriber.js'
      - 'src/audio-transcriber.ts'
      - 'src/main.ts'
      - 'js/main.js'
      - 'src/analysis.ts'
      - 'js/analysis.js'
      - 'src/constants.ts'
      - 'js/constants.js'
      - 'tests/test-stanzas.mjs'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/check-transcriber.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/audio-transcriber.js
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
      - run: npm test
