name: Kontrollo Çiftelia Studio
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'js/**'
      - 'assets/audio-real/**'
      - 'songs/**'
      - 'tests/**'
      - 'index.html'
      - 'app.css'
      - 'sw.js'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/check-app.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
      - run: node --check js/main.js
      - run: node --check sw.js
      - run: npm test
