name: Android APK - Çiftelia Studio
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK (without legacy tools)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ciftelia-studio-android.apk
      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ciftelia-studio-android-apk
          path: ciftelia-studio-android.apk
          if-no-files-found: error
      - name: Publish APK as GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.0.0-android >/dev/null 2>&1; then
            gh release upload v2.0.0-android ciftelia-studio-android.apk --clobber
          else
            gh release create v2.0.0-android ciftelia-studio-android.apk \
              --title 'Çiftelia Studio Android v2.0.0' \
              --notes 'APK debug për instalim manual në Android. Hap faqen HTTPS të Çiftelia Studio dhe kërkon internet. Nuk është publikim në Google Play.'
          fi
